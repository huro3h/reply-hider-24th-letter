<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Reply Hider for the 24th Letter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>reply-hider-24th-letter</h1>
    <span class="version" id="version"></span>
  </header>
  <label class="opt">
    <span class="label">非表示にした位置に縦線を残す</span>
    <span class="switch small">
      <input id="show-trace" type="checkbox">
      <span class="slider"></span>
    </span>
  </label>
  <label class="opt">
    <span class="label">自分宛てのリプライは表示する</span>
    <span class="switch small">
      <input id="show-to-me" type="checkbox">
      <span class="slider"></span>
    </span>
  </label>
  <form id="add">
    <input id="handle" type="text" placeholder="@handle" autocomplete="off" autofocus>
    <button type="submit" class="icon-btn add" title="追加" aria-label="追加">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </form>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
